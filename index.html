<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Party Games</title>
    <style>
      body { margin: 0; font-family: sans-serif; text-align: center; background: #1e1e2f; color: #fff; }
      .page { padding: 1rem; }
      button { font-size: 1.2rem; padding: 0.6rem 1.2rem; }
      button.secondary { background: #c9c9dc; }
      input { font-size: 1.2rem; padding: 0.6rem; border-radius: 8px; border: none;
              text-align: center; margin: 0.4rem; }
      .code { font-size: 4rem; letter-spacing: 0.4rem; font-weight: bold; margin: 0; }
      .qr { border-radius: 8px; }
      ul.seats { list-style: none; padding: 0; font-size: 1.5rem; }
      .warn { color: #ffb347; }
      .players { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
      .player { background: #33334d; border-radius: 10px; padding: 0.6rem 1rem; min-width: 150px; }
      a { color: #8ab4ff; }
      .bar { display: flex; justify-content: space-between; align-items: center;
             height: 44px; padding: 0 0.8rem; background: #14141f; font-size: 0.9rem; }
      .bar button { font-size: 0.85rem; padding: 0.3rem 0.7rem; }
      iframe.game { display: block; width: 100%; border: 0; background: #1e1e2f;
                    height: calc(100vh - 44px); height: calc(100dvh - 44px); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
