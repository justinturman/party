<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Party Games</title>
    <link rel="icon" type="image/svg+xml" href="/goldfish.svg" />
    <style>
      body { margin: 0; font-family: sans-serif; text-align: center; background: #1e1e2f; color: #fff; }
      .page { padding: 1rem; }
      button { font-size: 1.2rem; padding: 0.6rem 1.2rem; }
      button.secondary { background: #c9c9dc; }
      input { font-size: 1.2rem; padding: 0.6rem; border-radius: 8px; border: none;
              text-align: center; margin: 0.4rem; }
      .code { font-size: 4rem; letter-spacing: 0.4rem; font-weight: bold; margin: 0; }
      .qr { border-radius: 8px; }
      ul.seats { list-style: none; padding: 0; font-size: 1.5rem; }
      .warn { color: #ffb347; }
      .players { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
      .player { background: #33334d; border-radius: 10px; padding: 0.6rem 1rem; min-width: 150px; }
      .hero { padding: 1.2rem 1rem 0.6rem; }
      .hero h1 { margin: 0; font-size: 2.2rem; }
      .hero p { margin: 0.3rem 0 0.8rem; opacity: 0.8; }
      .banner-title { margin: 0; }
      .banner { display: block; width: 100%; max-width: 1024px; height: auto;
          margin: 0 auto 0.6rem; border-radius: 12px; }
      .joinbar { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px; }
      .joinbar input { width: 9rem; margin: 0; }
      .row { text-align: left; padding: 0 1rem; margin: 1.4rem 0; }
      .row h2 { margin: 0 0 0.5rem; font-size: 1.3rem; }
      .strip { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x proximity; }
      .tile { flex: 0 0 auto; width: 220px; padding: 0; border: 2px solid transparent; border-radius: 10px;
              background: #2a2a40; color: #fff; text-align: left; overflow: hidden; cursor: pointer;
              scroll-snap-align: start; transition: transform 0.15s, border-color 0.15s; }
      .tile:hover, .tile:focus-visible { transform: scale(1.04); border-color: #8ab4ff; outline: none; }
      .tile.open { border-color: #8ab4ff; }
      .thumb { position: relative; aspect-ratio: 16 / 9; background: var(--accent); display: flex;
              align-items: center; justify-content: center; }
      .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .thumb .initial { font-size: 3rem; font-weight: bold; opacity: 0.5; display:none; }
      .tile-name { display: block; padding: 0.5rem 0.7rem; font-size: 1rem; }
      .detail { background: #2a2a40; border-radius: 12px; margin-top: 10px; overflow: hidden; }
      .detail[hidden] { display: none; }
      .detail-inner { display: flex; flex-wrap: wrap; }
      .detail-art { flex: 1 1 280px; min-height: 160px; position: relative; background: var(--accent); }
      .detail-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .detail-text { flex: 2 1 320px; padding: 1rem 1.2rem; position: relative; }
      .detail-text h3 { margin: 0 0 0.2rem; font-size: 1.6rem; }
      .detail-text .meta { opacity: 0.7; margin: 0 0 0.8rem; }
      .detail-text button { margin: 3px; }
      .detail .close { position: absolute; top: 6px; right: 8px; font-size: 1.2rem; padding: 0.1rem 0.6rem;
                      background: transparent; color: #fff; border: none; }
      .resume { margin: 4px; background: #8ab4ff; }
      a { color: #8ab4ff; }
      .bar { display: flex; justify-content: space-between; align-items: center;
             height: 44px; padding: 0 0.8rem; background: #14141f; font-size: 0.9rem; }
      .bar button { font-size: 0.85rem; padding: 0.3rem 0.7rem; }
      iframe.game { display: block; width: 100%; border: 0; background: #1e1e2f;
                    height: calc(100vh - 44px); height: calc(100dvh - 44px); }
      .bar span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis;
                        white-space: nowrap; margin-right: 0.6rem; }
      #joinpanel { position: fixed; inset: 44px 0 0 0; z-index: 5; overflow: auto;
             background: rgba(20, 20, 31, 0.97); display: flex;
             align-items: center; justify-content: center; }
      #joinpanel[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
